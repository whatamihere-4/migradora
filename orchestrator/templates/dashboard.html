<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Migradora</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0e0e10;
      --surface: #18181b;
      --border: #2d2d33;
      --accent: #6d5dfc;
      --accent-hover: #8577fd;
      --text: #e4e4e7;
      --muted: #71717a;
      --success: #22c55e;
      --error: #ef4444;
      --warn: #f59e0b;
      --radius: 10px;
    }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 2rem 1rem 3rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 { font-size: 2rem; font-weight: 700; margin-bottom: 0.25rem; }
    .subtitle { color: var(--muted); font-size: 0.9rem; margin-bottom: 1.5rem; text-align: center; }
    .wrap { width: 100%; max-width: 900px; }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem 1.5rem;
      margin-bottom: 1rem;
    }
    .card h2 { font-size: 0.95rem; font-weight: 600; margin-bottom: 0.85rem; }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
      gap: 0.75rem;
    }
    .stat {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.75rem;
      text-align: center;
    }
    .stat .val { font-size: 1.35rem; font-weight: 700; }
    .stat .lbl { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; margin-top: 0.2rem; }
    .stat.ok .val { color: var(--success); }
    .stat.warn .val { color: var(--warn); }
    .stat.err .val { color: var(--error); }
    .row { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; margin-top: 0.75rem; }
    .btn {
      padding: 0.55rem 1rem; font-size: 0.82rem; font-weight: 600;
      border: none; border-radius: 6px; cursor: pointer; color: #fff;
      background: var(--accent); transition: background 0.15s;
    }
    .btn:hover { background: var(--accent-hover); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn.secondary { background: transparent; border: 1px solid var(--border); color: var(--text); }
    .btn.secondary:hover { border-color: var(--accent); }
    .pill {
      display: inline-block; padding: 0.2rem 0.55rem; border-radius: 999px;
      font-size: 0.75rem; font-weight: 600; text-transform: uppercase;
    }
    .pill.running { background: rgba(34,197,94,0.15); color: var(--success); }
    .pill.paused { background: rgba(245,158,11,0.15); color: var(--warn); }
    .pill.failed { background: rgba(239,68,68,0.15); color: var(--error); }
    .meta { font-size: 0.82rem; color: var(--muted); line-height: 1.5; }
    .meta strong { color: var(--text); font-weight: 600; }
    .progress-wrap { width: 100%; height: 6px; background: var(--bg); border-radius: 3px; overflow: hidden; margin-top: 0.5rem; }
    .progress-bar { height: 100%; background: var(--accent); border-radius: 3px; transition: width 0.4s ease; width: 0%; }
    .progress-bar.indeterminate { width: 30%; animation: indeterminate 1.5s ease-in-out infinite; }
    @keyframes indeterminate {
      0% { margin-left: 0%; width: 30%; }
      50% { margin-left: 40%; width: 30%; }
      100% { margin-left: 0%; width: 30%; }
    }
    .job {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 1rem 1.15rem; margin-bottom: 0.65rem;
      font-size: 0.85rem;
    }
    .job-header { display: flex; justify-content: space-between; gap: 0.75rem; align-items: flex-start; }
    .job-actions { flex-shrink: 0; }
    .btn.skip {
      background: transparent; border: 1px solid var(--border); color: var(--muted);
      padding: 0.35rem 0.65rem; font-size: 0.75rem;
    }
    .btn.skip:hover { border-color: var(--error); color: var(--error); }
    .job-status.skipped { color: var(--muted); }
    .job-title { font-weight: 600; word-break: break-word; flex: 1; }
    .job-folder { font-size: 0.75rem; color: var(--accent); margin: 0.25rem 0; }
    .job-status { color: var(--muted); margin-top: 0.35rem; }
    .job-status.uploaded { color: var(--success); }
    .job-status.failed { color: var(--error); }
    .job-status.downloading, .job-status.splitting, .job-status.uploading { color: var(--accent); }
    .job-error { margin-top: 0.4rem; font-size: 0.78rem; color: var(--error); word-break: break-word; }
    .job-links { margin-top: 0.35rem; font-size: 0.78rem; }
    .job-links a { color: var(--accent); text-decoration: none; }
    .job-links a:hover { text-decoration: underline; }
    .progress-log {
      margin-top: 0.45rem;
      padding: 0.45rem 0.55rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.02);
      color: var(--muted);
      font-size: 0.72rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      line-height: 1.35;
      max-height: 92px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-word;
      display: none;
    }
    .progress-now {
      margin-top: 0.45rem;
      padding: 0.45rem 0.55rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: rgba(109, 93, 252, 0.08);
      color: var(--text);
      font-size: 0.76rem;
      line-height: 1.4;
      display: none;
    }
    .upload-overall-label {
      font-size: 0.68rem; font-weight: 600; color: var(--muted);
      margin-top: 0.35rem; letter-spacing: 0.02em; text-transform: uppercase;
      display: none;
    }
    .upload-parts-list {
      margin-top: 0.45rem; display: none; flex-direction: column; gap: 0.32rem;
    }
    .upload-part-row {
      display: grid; grid-template-columns: minmax(0, 1fr) 5rem 2.2rem;
      align-items: center; gap: 0.45rem; font-size: 0.68rem;
    }
    .upload-part-label {
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted);
    }
    .upload-part-row.uploading .upload-part-label,
    .upload-part-row.splitting .upload-part-label { color: var(--accent); font-weight: 600; }
    .upload-part-row.done .upload-part-label { color: var(--success); }
    .upload-part-bar-wrap { height: 4px; }
    .upload-part-bar {
      height: 100%; background: var(--accent); border-radius: 2px;
      transition: width 0.35s ease; width: 0%;
    }
    .upload-part-row.done .upload-part-bar { background: var(--success); }
    .upload-part-row.pending .upload-part-bar { background: var(--border); width: 0 !important; }
    .upload-part-pct { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
    .upload-detail { font-size: 0.75rem; color: var(--muted); margin-top: 0.3rem; }
    .empty { text-align: center; color: var(--muted); padding: 2rem; font-size: 0.85rem; }
    .filter-row { display: flex; gap: 0.4rem; flex-wrap: wrap; margin-bottom: 0.75rem; }
    .filter-row button { padding: 0.35rem 0.65rem; font-size: 0.75rem; }
    .filter-row button.active { background: var(--accent); color: #fff; border: none; border-radius: 6px; }
    .filter-row button:not(.active) { background: transparent; border: 1px solid var(--border); color: var(--muted); border-radius: 6px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Migradora</h1>
    <p class="subtitle">Gofile → Filester mirror &mdash; queue monitor</p>

    <div class="card">
      <h2>Queue</h2>
      <div class="row">
        <span class="pill running" id="queue-pill">—</span>
        <span class="meta" id="queue-meta"></span>
      </div>
      <div class="progress-wrap" style="margin-top:0.85rem">
        <div class="progress-bar" id="overall-progress" style="width:0%"></div>
      </div>
      <div class="meta" id="progress-detail" style="margin-top:0.35rem"></div>
      <div class="stats-grid" style="margin-top:1rem" id="stats-grid"></div>
      <div class="row">
        <button class="btn" id="btn-resume">Resume</button>
        <button class="btn secondary" id="btn-pause">Pause</button>
        <button class="btn secondary" id="btn-retry">Retry failed</button>
        <button class="btn secondary" id="btn-retry-disk" title="Re-queue jobs skipped for insufficient disk only">Retry disk-skipped</button>
        <button class="btn secondary" id="btn-discover">Discover</button>
      </div>
    </div>

    <div class="card">
      <h2>Pipeline</h2>
      <div class="meta" id="pipeline-meta">—</div>
    </div>

    <div class="card">
      <h2>Jobs</h2>
      <div class="filter-row" id="filters"></div>
      <div id="jobs-list"><div class="empty">Loading…</div></div>
    </div>
  </div>

  <script>
    const FILTERS = ['all', 'pending', 'downloading', 'uploading', 'uploaded', 'failed', 'skipped'];
    let activeFilter = 'all';
    let refreshTimer = null;
    const LOG_SCROLL_EPS = 8;

    function logIsPinnedToBottom(logEl) {
      const max = logEl.scrollHeight - logEl.clientHeight;
      if (max <= 0) return true;
      return max - logEl.scrollTop <= LOG_SCROLL_EPS;
    }

    function attachLogScrollBehavior(logEl) {
      if (!logEl || logEl.dataset.logScrollBound) return;
      logEl.dataset.logScrollBound = '1';
      logEl.addEventListener('scroll', () => {
        logEl.dataset.logFollow = logIsPinnedToBottom(logEl) ? '1' : '0';
      });
    }

    function renderUploadProgress(container, p) {
      if (!container) return;
      const barEl = container.querySelector('.progress-bar-main');
      const detailEl = container.querySelector('.upload-detail');
      const partsEl = container.querySelector('.upload-parts-list');
      const overallLabel = container.querySelector('.upload-overall-label');
      if (!barEl || !detailEl) return;

      if (!p || p.type !== 'upload') {
        if (partsEl) { partsEl.style.display = 'none'; partsEl.innerHTML = ''; }
        if (overallLabel) overallLabel.style.display = 'none';
        barEl.classList.add('indeterminate');
        barEl.style.width = '';
        detailEl.textContent = '';
        return;
      }

      const isSplit = p.mode === 'split' && Array.isArray(p.parts) && p.parts.length > 0;
      if (overallLabel) {
        if (isSplit) {
          overallLabel.style.display = 'block';
          overallLabel.textContent = p.phase === 'splitting'
            ? (p.label || 'Splitting for Filester upload')
            : `Overall upload${p.part_count ? ` · ${p.part_count} parts` : ''}`;
        } else {
          overallLabel.style.display = 'none';
        }
      }

      if (partsEl) {
        if (isSplit) {
          partsEl.style.display = 'flex';
          partsEl.innerHTML = p.parts.map(part => {
            const st = part.status || 'pending';
            const pct = part.percent != null ? part.percent : 0;
            const lbl = part.label || `Part ${part.index}`;
            const sizeHint = part.size_fmt ? ` (${part.size_fmt})` : '';
            return `<div class="upload-part-row ${esc(st)}">` +
              `<span class="upload-part-label" title="${esc(lbl + sizeHint)}">${esc(lbl)}</span>` +
              `<div class="progress-wrap upload-part-bar-wrap">` +
              `<div class="upload-part-bar" style="width:${Math.max(0, Math.min(100, pct))}%"></div>` +
              `</div>` +
              `<span class="upload-part-pct">${st === 'pending' ? '…' : pct.toFixed(0) + '%'}</span>` +
              `</div>`;
          }).join('');
        } else {
          partsEl.style.display = 'none';
          partsEl.innerHTML = '';
        }
      }

      if (p.phase === 'splitting') {
        barEl.classList.add('indeterminate');
        barEl.style.width = '';
        const bits = [p.source_fmt ? `Source ${p.source_fmt}` : 'Preparing parts'];
        if (p.folder_name) bits.push(`Folder: ${p.folder_name}`);
        detailEl.textContent = bits.join('  ·  ');
        return;
      }

      barEl.classList.remove('indeterminate');
      if (p.percent !== undefined) {
        barEl.style.width = Math.max(0, Math.min(100, p.percent)) + '%';
      } else {
        barEl.classList.add('indeterminate');
        barEl.style.width = '';
      }

      const bits = [];
      if (p.uploaded_fmt && p.total_fmt) bits.push(`${p.uploaded_fmt} / ${p.total_fmt}`);
      if (p.speed_fmt) bits.push(p.speed_fmt);
      if (p.eta !== undefined && p.eta > 0) bits.push(`ETA ${p.eta}s`);
      if (p.folder_name) bits.push(`Folder: ${p.folder_name}`);
      if (isSplit && p.current_part && p.part_count) {
        bits.unshift(`Part ${p.current_part}/${p.part_count} uploading`);
      }
      detailEl.textContent = bits.join('  ·  ');
    }

    function renderJobActivity(container, statusText, logs) {
      if (!container) return;
      const nowEl = container.querySelector('.progress-now');
      const logEl = container.querySelector('.progress-log');
      if (statusText) {
        nowEl.style.display = 'block';
        nowEl.textContent = statusText;
      } else {
        nowEl.style.display = 'none';
        nowEl.textContent = '';
      }
      renderJobLogs(logEl, logs);
    }

    function renderJobLogs(logEl, logs) {
      if (!logEl) return;
      attachLogScrollBehavior(logEl);
      if (!logs || !logs.length) {
        logEl.style.display = 'none';
        logEl.textContent = '';
        logEl.dataset.logFollow = '';
        return;
      }
      logEl.style.display = 'block';
      const follow = logEl.dataset.logFollow !== '0';
      const prevST = logEl.scrollTop;
      const prevSH = logEl.scrollHeight;
      logEl.textContent = logs.slice(-22).join('\n');
      requestAnimationFrame(() => {
        if (follow) {
          logEl.dataset.logFollow = '1';
          logEl.scrollTop = logEl.scrollHeight;
        } else {
          const d = logEl.scrollHeight - prevSH;
          const max = Math.max(0, logEl.scrollHeight - logEl.clientHeight);
          logEl.scrollTop = Math.max(0, Math.min(max, prevST + d));
        }
      });
    }

    function esc(s) {
      return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function fmtBytes(n) {
      n = Number(n) || 0;
      if (n >= 1e12) return (n/1e12).toFixed(2) + ' TB';
      if (n >= 1e9) return (n/1e9).toFixed(2) + ' GB';
      if (n >= 1e6) return (n/1e6).toFixed(1) + ' MB';
      if (n >= 1e3) return (n/1e3).toFixed(0) + ' KB';
      return n + ' B';
    }

    function fmtSpeed(bps) {
      bps = Number(bps) || 0;
      if (!bps) return '—';
      if (bps >= 1e9) return (bps/1e9).toFixed(2) + ' GB/s';
      if (bps >= 1e6) return (bps/1e6).toFixed(1) + ' MB/s';
      if (bps >= 1e3) return (bps/1e3).toFixed(0) + ' KB/s';
      return Math.round(bps) + ' B/s';
    }

    function fmtEta(sec) {
      if (sec == null || sec < 0 || !isFinite(sec)) return '—';
      sec = Math.round(sec);
      if (sec < 60) return sec + 's';
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      if (m < 60) return s ? `${m}m ${s}s` : `${m}m`;
      const h = Math.floor(m / 60);
      const rm = m % 60;
      if (h < 24) return rm ? `${h}h ${rm}m` : `${h}h`;
      const d = Math.floor(h / 24);
      const rh = h % 24;
      return rh ? `${d}d ${rh}h` : `${d}d`;
    }

    async function api(path, opts) {
      const r = await fetch(path, opts);
      if (!r.ok) throw new Error(await r.text());
      return r.json();
    }

    async function post(path) {
      return api(path, { method: 'POST' });
    }

    function scheduleRefresh(ms) {
      clearTimeout(refreshTimer);
      refreshTimer = setTimeout(refresh, ms);
    }

    function renderFilters() {
      const el = document.getElementById('filters');
      el.innerHTML = FILTERS.map(f =>
        `<button class="${f === activeFilter ? 'active' : ''}" data-f="${f}">${f}</button>`
      ).join('');
      el.querySelectorAll('button').forEach(btn => {
        btn.onclick = () => { activeFilter = btn.dataset.f; renderFilters(); refresh(); };
      });
    }

    function renderStats(stats, eta) {
      const items = [
        ['Total', stats.total, ''],
        ['Pending', stats.pending, stats.pending ? 'warn' : ''],
        ['Active', (stats.downloading||0) + (stats.splitting||0) + (stats.uploading||0), ''],
        ['Uploaded', stats.uploaded, 'ok'],
        ['Failed', stats.failed, stats.failed ? 'err' : ''],
        ['Skipped', stats.skipped || 0, ''],
      ];
      document.getElementById('stats-grid').innerHTML = items.map(([l,v,c]) =>
        `<div class="stat ${c}"><div class="val">${v}</div><div class="lbl">${l}</div></div>`
      ).join('');
      const pct = stats.completion_pct || 0;
      document.getElementById('overall-progress').style.width = pct + '%';
      let detail = `${pct}% complete · ${fmtBytes(stats.uploaded_bytes)} / ${fmtBytes(stats.total_bytes)} uploaded`;
      if (eta && eta.queue_label && eta.queue_label !== '—') {
        detail += ` · ETA ${eta.queue_label}`;
        if (eta.download_label !== '—' || eta.upload_label !== '—') {
          detail += ` (↓${eta.download_label} · ↑${eta.upload_label})`;
        }
      }
      document.getElementById('progress-detail').textContent = detail;
    }

    function canSkip(j) {
      return j.status !== 'uploaded' && j.status !== 'skipped';
    }

    async function skipJob(id, filename) {
      const label = filename ? `#${id} ${filename}` : `#${id}`;
      if (!confirm(`Skip ${label}?\n\nLocal download files will be deleted. Parts already uploaded to Filester stay there.`)) return;
      await post(`/jobs/${id}/skip`);
      refresh();
    }

    function renderJobs(jobs, pipeline, currentJob, eta) {
      const list = document.getElementById('jobs-list');
      const currentId = pipeline && pipeline.current_job_id;
      const phase = pipeline && pipeline.phase;
      let filtered = activeFilter === 'all' ? jobs : jobs.filter(j => j.status === activeFilter);
      if (currentJob && activeFilter !== 'all' && !filtered.some(j => j.id === currentJob.id)) {
        const isPipelineCurrent = pipeline && pipeline.current_job_id === currentJob.id;
        const phaseMatch = currentJob.status === activeFilter
          || (isPipelineCurrent && activeFilter === 'uploading'
            && (phase === 'splitting' || phase === 'uploading'));
        if (phaseMatch) filtered = [currentJob, ...filtered];
      }
      const sorted = [...filtered].sort((a, b) => a.id - b.id);
      if (!sorted.length) {
        list.innerHTML = '<div class="empty">No jobs in this filter</div>';
        return;
      }
      const progBytes = pipeline && pipeline.progress_bytes || 0;
      const progTotal = pipeline && pipeline.progress_total || 0;
      const phaseEta = eta && eta.phase_label;
      const phaseSpeed = pipeline && pipeline.speed_bps;
      list.innerHTML = sorted.map(j => {
        const isCurrent = currentId === j.id;
        const isActive = isCurrent && (phase === 'downloading' || phase === 'splitting' || phase === 'uploading');
        const uploadProgress = isCurrent ? (pipeline.upload_progress || j.upload_progress) : j.upload_progress;
        const statusText = isCurrent ? (pipeline.status_text || j.status_text || '') : (j.status_text || '');
        const parts = (j.filester_slug || []).length;
        const partHint = parts > 1 ? ` (${parts} parts)` : parts === 1 ? '' : '';
        const links = (j.filester_slug || []).map(s =>
          `<a href="https://filester.me/d/${esc(s)}" target="_blank">${esc(s)}</a>`
        ).join(' · ');
        let progressHtml = '';
        if (isActive && (uploadProgress || phase === 'downloading')) {
          if (phase === 'downloading') {
            const pct = progTotal > 0 ? Math.min(100, Math.round((progBytes / progTotal) * 100)) : 0;
            const etaLine = phaseEta && phaseEta !== '—'
              ? ` · ETA ${phaseEta} · ${fmtSpeed(phaseSpeed)}`
              : '';
            progressHtml = `<div class="upload-overall-label">Downloading</div>` +
              `<div class="progress-wrap"><div class="progress-bar progress-bar-main" style="width:${pct}%"></div></div>` +
              `<div class="upload-detail">${pct}% · ${fmtBytes(progBytes)} / ${fmtBytes(progTotal)}${etaLine}</div>`;
          } else {
            progressHtml = `<div class="upload-overall-label"></div>` +
              `<div class="progress-wrap"><div class="progress-bar progress-bar-main"></div></div>` +
              `<div class="upload-parts-list"></div>` +
              `<div class="upload-detail"></div>`;
          }
        }
        const skipBtn = canSkip(j)
          ? `<div class="job-actions"><button class="btn skip" data-skip-id="${j.id}" data-skip-name="${esc(j.filename)}">Skip</button></div>`
          : '';
        const logs = Array.isArray(j.job_logs) ? j.job_logs : [];
        const showActivity = isActive && (statusText || logs.length);
        const activityHtml = showActivity
          ? `<div class="job-activity" data-job-activity="${j.id}">` +
            `<div class="progress-now"></div>` +
            `<div class="progress-log" data-job-log="${j.id}"></div>` +
            `</div>`
          : '';
        return `<div class="job" data-job-id="${j.id}">
          <div class="job-header">
            <div>
              <div class="job-title">#${j.id} ${esc(j.filename)}${partHint}</div>
              ${j.gofile_path ? `<div class="job-folder">${esc(j.gofile_path)}</div>` : ''}
              <div class="job-status ${esc(j.status)}">${esc(j.status)} · ${fmtBytes(j.size_bytes)}${j.attempts > 1 ? ' · attempt ' + j.attempts : ''}</div>
              ${j.last_error ? `<div class="job-error">${esc(j.last_error)}</div>` : ''}
              ${links ? `<div class="job-links">${links}</div>` : ''}
            </div>
            ${skipBtn}
          </div>
          ${progressHtml ? `<div class="job-upload-progress" data-job-upload="${j.id}">${progressHtml}</div>` : ''}
          ${activityHtml}
        </div>`;
      }).join('');
      sorted.forEach(j => {
        const isCurrent = currentId === j.id;
        const uploadProgress = isCurrent ? (pipeline.upload_progress || j.upload_progress) : j.upload_progress;
        const statusText = isCurrent ? (pipeline.status_text || j.status_text || '') : (j.status_text || '');
        const logs = Array.isArray(j.job_logs) ? j.job_logs : [];
        const uploadEl = list.querySelector(`[data-job-upload="${j.id}"]`);
        if (uploadEl && uploadProgress) {
          renderUploadProgress(uploadEl, uploadProgress);
        }
        const activityEl = list.querySelector(`[data-job-activity="${j.id}"]`);
        if (activityEl) {
          renderJobActivity(activityEl, statusText, logs);
        }
      });
    }

    async function refresh() {
      try {
        const [status, jobsResp] = await Promise.all([
          api('/status'),
          api('/jobs?limit=500'),
        ]);
        const st = status.stats || {};
        const eta = status.eta || {};
        renderStats(st, eta);
        const qs = status.queue_state || 'unknown';
        const pill = document.getElementById('queue-pill');
        pill.textContent = qs;
        pill.className = 'pill ' + (qs === 'running' ? 'running' : qs.includes('paused') ? 'paused' : 'failed');
        document.getElementById('queue-meta').innerHTML = status.pause_reason
          ? `<strong>Paused:</strong> ${esc(status.pause_reason)}` : '';
        const p = status.pipeline || {};
        const phaseLabel = p.phase && p.phase !== 'idle'
          ? `<strong>${esc(p.phase)}</strong>${p.current_job_name ? ' — ' + esc(p.current_job_name) : ''} (job #${p.current_job_id || '?'})`
          : 'Idle — waiting for work';
        const progLabel = p.progress_total > 0 && p.phase !== 'idle'
          ? `<br>${Math.round((p.progress_bytes / p.progress_total) * 100)}% · ${fmtBytes(p.progress_bytes)} / ${fmtBytes(p.progress_total)}`
          : '';
        const speedLabel = p.speed_bps && p.phase !== 'idle'
          ? `<br>${fmtSpeed(p.speed_bps)}`
          : '';
        const etaLabel = eta.phase_label && eta.phase_label !== '—' && p.phase !== 'idle'
          ? ` · ETA ${eta.phase_label}`
          : '';
        const queueEtaLabel = eta.queue_label && eta.queue_label !== '—'
          ? `<br><strong>Queue ETA:</strong> ${esc(eta.queue_label)}`
          + (eta.download_label !== '—' || eta.upload_label !== '—'
            ? ` (download ${esc(eta.download_label)}, upload ${esc(eta.upload_label)})`
            : '')
          : '';
        const avgSpeedLabel = (eta.avg_download_bps || eta.avg_upload_bps)
          ? `<br>Avg ↓${fmtSpeed(eta.avg_download_bps)} · ↑${fmtSpeed(eta.avg_upload_bps)}`
          : '';
        document.getElementById('pipeline-meta').innerHTML =
          phaseLabel + progLabel + speedLabel + etaLabel + queueEtaLabel + avgSpeedLabel;
        const jobs = jobsResp.jobs || [];
        if (status.current_job && status.current_job.job_logs && status.current_job.job_logs.length) {
          const cur = jobs.find(j => j.id === status.current_job.id);
          if (cur) {
            cur.job_logs = status.current_job.job_logs;
            cur.status_text = status.current_job.status_text || cur.status_text;
            cur.upload_progress = status.current_job.upload_progress || cur.upload_progress;
          } else jobs.unshift(status.current_job);
        } else if (status.current_job) {
          const cur = jobs.find(j => j.id === status.current_job.id);
          if (cur) {
            cur.status_text = status.current_job.status_text || cur.status_text;
            cur.upload_progress = status.current_job.upload_progress || cur.upload_progress;
          }
        }
        renderJobs(jobs, p, status.current_job, eta);
        const diskSkipped = st.disk_skipped || 0;
        const retryDiskBtn = document.getElementById('btn-retry-disk');
        retryDiskBtn.disabled = diskSkipped === 0;
        retryDiskBtn.textContent = diskSkipped
          ? `Retry disk-skipped (${diskSkipped})`
          : 'Retry disk-skipped';
        const active = (st.downloading||0) + (st.splitting||0) + (st.uploading||0);
        scheduleRefresh(active > 0 ? 2000 : 4000);
      } catch (e) {
        document.getElementById('jobs-list').innerHTML = `<div class="empty">Error: ${esc(e.message)}</div>`;
        scheduleRefresh(5000);
      }
    }

    document.getElementById('btn-resume').onclick = async () => { await post('/resume'); refresh(); };
    document.getElementById('btn-pause').onclick = async () => { await post('/pause'); refresh(); };
    document.getElementById('btn-retry').onclick = async () => { await post('/retry-failed'); refresh(); };
    document.getElementById('btn-retry-disk').onclick = async () => {
      if (!confirm(
        'Re-queue jobs skipped for insufficient disk only?\n\n'
        + 'Jobs skipped as too large for the VPS disk budget are not affected.'
      )) return;
      const res = await post('/retry-disk-skipped');
      alert(`Re-queued ${res.reset || 0} job(s)`);
      refresh();
    };
    document.getElementById('btn-discover').onclick = async () => {
      const btn = document.getElementById('btn-discover');
      btn.disabled = true;
      try { await post('/discover'); } finally { btn.disabled = false; refresh(); }
    };

    document.getElementById('jobs-list').addEventListener('click', (e) => {
      const btn = e.target.closest('[data-skip-id]');
      if (!btn) return;
      skipJob(btn.dataset.skipId, btn.dataset.skipName).catch(err => alert(err.message));
    });

    renderFilters();
    refresh();
  </script>
</body>
</html>
